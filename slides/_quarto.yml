author:
  - name: Ryan McShane, Ph.D.
    affiliations:
      - "![The University of Chicago, Department of Statistics](images/logos/uchicago.svg){.affil-logo}"
  - name: Merlin Salesse
    affiliations: "![Naboo](images/logos/naboo.svg){.affil-logo}"
  - name: Andres de la Garza
    affiliations: "![Right On Bracket](images/logos/right-on-bracket.png){.affil-logo}"
  - name: Maurice Thomas
    affiliations: "![Library Labs](images/logos/library-labs.png){.affil-logo}"
  - name: Raj Padmanabhan
    affiliations: "![Salesforce](images/logos/salesforce.svg){.affil-logo}"
format:
  revealjs:
    theme: [default, knit-files/mcshane-scss-theme.scss, knit-files/spurs2-scss-theme.scss]
    slide-number: c/t
    width: 1920
    height: 1080
    code-block-height: 880px
    margin: 0.03
    number-sections: true
    number-depth: 2
    # multiplex: true
    code-annotations: true
    # transition: fade
    incremental: false
    # chalkboard: true
    embed-resources: true
    slide-level: 3
    code-link: false # set to true if not needing code line numbers
    echo: true
revealjs-plugins:
  - codewindow
knitr:
  opts_chunk:
    R.options:
      width: 88
crossref:
  sec-prefix: Slide   # default is Section
